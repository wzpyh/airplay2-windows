name: build

# Builds the standalone bundle on every push and pull request.
# Pushing a tag v* also creates a *draft* GitHub release with the MSI, the bundle zip and a sources zip
# (everything needed to rebuild it, including the MSYS2 source packages of the shipped DLLs).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: git curl zip

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="ci-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Fetch sources
        run: bash scripts/fetch.sh

      - name: Build and bundle
        run: bash scripts/build.sh

      - name: MSI
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          # MSI versions are numeric: v0.3.0 -> 0.3.0, untagged builds -> 0.0.<run number>
          $v = if ($env:VERSION -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          wix build installer/airplay2-windows.wxs -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d BundleDir=dist/airplay2-windows -d Version=$v -o "dist/airplay2-windows-$env:VERSION-x64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item dist/*.msi

      - name: Sources zip
        run: |
          s="dist/airplay2-windows-$VERSION-sources"
          mkdir -p "$s/upstream" "$s/msys2"
          cp sources/* "$s/upstream/"
          git archive --format=tar --prefix=airplay2-windows/ HEAD | tar x -C "$s"
          while read -r f; do
            curl -fsSL --retry 3 -o "$s/msys2/$f" "https://repo.msys2.org/msys/sources/$f"
          done < dist/msys2-sources.txt
          (cd dist && zip -qr "airplay2-windows-$VERSION-sources.zip" "airplay2-windows-$VERSION-sources")
          ls -l dist/*.zip

      # two artifacts: the small bundle people install, and the large sources zip (GPL/LGPL source)
      - uses: actions/upload-artifact@v4
        with:
          name: airplay2-windows-${{ env.VERSION }}-x64
          path: dist/airplay2-windows-${{ env.VERSION }}-x64.zip
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: airplay2-windows-${{ env.VERSION }}-x64-msi
          path: dist/airplay2-windows-${{ env.VERSION }}-x64.msi
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: airplay2-windows-${{ env.VERSION }}-sources
          path: dist/airplay2-windows-${{ env.VERSION }}-sources.zip
          compression-level: 0

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/airplay2-windows-${{ env.VERSION }}-x64.msi
            dist/airplay2-windows-${{ env.VERSION }}-x64.zip
            dist/airplay2-windows-${{ env.VERSION }}-sources.zip
